
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player">
        <header>
            <h1>♫ Melody</h1>
            <p>Your music, your mood.</p>
        </header>

        <div class="cover" id="cover">
            <span>♫</span>
        </div>

        <section class="song-info">
            <h2 id="title">Loading song...</h2>
            <p id="artist">Unknown Artist</p>
        </section>

        <audio id="audio"></audio>

        <div class="progress-container">
            <input type="range" id="progress"
                   min="0" max="100" value="0">
            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button id="prev" aria-label="Previous song">⏮</button>
            <button id="play" class="play-btn"
                    aria-label="Play">▶</button>
            <button id="next" aria-label="Next song">⏭</button>
        </div>

        <div class="volume-container">
            <label for="volume">🔊 Volume</label>
            <input type="range" id="volume"
                   min="0" max="1" step="0.01" value="0.7">
        </div>

        <section class="playlist-section">
            <h3>My Playlist</h3>
            <ul id="playlist"></ul>
        </section>

        <footer>Made with ♡ and JavaScript</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
